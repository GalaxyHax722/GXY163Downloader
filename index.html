<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简约音乐搜索 · 试听下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #1e1e1e;
            padding: 2rem 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .app {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 1.2rem;
        }

        h1 {
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: -0.01em;
            color: #111;
        }

        .sub {
            color: #777;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .search-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 0.5rem;
            background: #f9f9f9;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #ececec;
            transition: border 0.1s;
        }

        .search-section:focus-within {
            border-color: #aaa;
        }

        .search-section input {
            flex: 1;
            min-width: 180px;
            border: none;
            background: transparent;
            padding: 0.6rem 0.2rem;
            font-size: 1rem;
            outline: none;
            color: #1e1e1e;
        }

        .search-section input::placeholder {
            color: #b0b0b0;
            font-weight: 300;
        }

        .search-section button {
            background: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 30px;
            padding: 0.5rem 1.6rem;
            font-size: 0.9rem;
            color: #222;
            cursor: pointer;
            transition: 0.1s ease;
            white-space: nowrap;
            background: #f5f5f5;
        }

        .search-section button:hover {
            background: #e8e8e8;
            border-color: #b0b0b0;
        }

        .search-section button:active {
            background: #dcdcdc;
        }

        .status {
            font-size: 0.9rem;
            color: #666;
            padding: 0.25rem 0 0.25rem 0.2rem;
            min-height: 1.8rem;
        }

        .status span {
            background: #f0f0f0;
            padding: 0.15rem 0.9rem;
            border-radius: 20px;
            display: inline-block;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 0px;
            border: 1px solid #efefef;
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
        }

        .list-header {
            display: grid;
            grid-template-columns: 40px 1fr 80px 80px 90px;
            background: #fafafa;
            padding: 0.7rem 1.2rem;
            font-size: 0.8rem;
            color: #888;
            border-bottom: 1px solid #eee;
            letter-spacing: 0.02em;
        }

        .list-header span:last-child {
            text-align: right;
        }

        .song-item {
            display: grid;
            grid-template-columns: 40px 1fr 80px 80px 90px;
            align-items: center;
            padding: 0.7rem 1.2rem;
            border-bottom: 1px solid #f2f2f2;
            transition: background 0.08s;
            font-size: 0.95rem;
        }

        .song-item:last-child {
            border-bottom: none;
        }

        .song-item:hover {
            background: #f8f8f8;
        }

        .song-index {
            color: #b0b0b0;
            font-size: 0.85rem;
            text-align: left;
        }

        .song-name {
            font-weight: 400;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 0.5rem;
        }

        .song-artist {
            color: #6a6a6a;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-actions {
            display: flex;
            gap: 0.4rem;
            justify-content: flex-end;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: none;
            border: 1px solid #d4d4d4;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            color: #3a3a3a;
            cursor: pointer;
            transition: all 0.08s;
            background: #fff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            white-space: nowrap;
            min-width: 44px;
        }

        .action-btn:hover {
            background: #eaeaea;
            border-color: #b8b8b8;
            color: #000;
        }

        .action-btn:active {
            background: #d0d0d0;
        }

        .action-btn.play-btn.playing {
            background: #e0f0e0;
            border-color: #6a9;
            color: #1a6a3a;
        }

        .action-btn.download-btn {
            background: #f0f7ff;
            border-color: #b0c8e0;
            color: #1a4a7a;
        }

        .action-btn.download-btn:hover {
            background: #dce8f5;
            border-color: #8aacd0;
        }

        .action-btn.download-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f5f5f5;
            color: #999;
        }

        .no-result {
            text-align: center;
            padding: 3rem 1rem;
            color: #aaa;
            font-size: 0.95rem;
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #bbb;
            text-align: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 1.5rem;
        }

        @media (max-width: 700px) {
            body {
                padding: 1.2rem 0.8rem;
            }
            .list-header {
                display: none;
            }
            .song-item {
                grid-template-columns: 32px 1fr 70px;
                padding: 0.7rem 0.8rem;
                gap: 0.2rem;
            }
            .song-artist {
                grid-column: 2 / 3;
                grid-row: 2;
                font-size: 0.8rem;
                color: #888;
            }
            .song-actions {
                grid-column: 3 / 4;
                grid-row: 1 / 3;
                flex-direction: column;
                align-items: flex-end;
                gap: 0.3rem;
                justify-content: center;
            }
            .song-name {
                grid-column: 2 / 3;
                grid-row: 1;
            }
            .song-index {
                grid-row: 1 / 3;
                align-self: center;
            }
            .action-btn {
                font-size: 0.65rem;
                padding: 0.1rem 0.5rem;
                min-width: 36px;
            }
            .search-section {
                border-radius: 30px;
                padding: 0.5rem 1rem;
            }
            .search-section button {
                padding: 0.4rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        .audio-player {
            display: none;
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <h1>🎵 音乐搜索 · 试听下载</h1>
        <div class="sub">简约白色 · 支持试听与下载</div>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" placeholder="输入歌曲或歌手名称..." value="周杰伦" />
        <button id="searchBtn">搜索</button>
    </div>

    <div class="status" id="statusArea"><span>✨ 输入关键词，点击搜索</span></div>

    <audio id="audioPlayer" class="audio-player" controls preload="none"></audio>

    <div class="song-list" id="songListContainer">
        <div class="list-header">
            <span>#</span>
            <span>歌曲</span>
            <span>歌手</span>
            <span style="text-align: center;">试听</span>
            <span style="text-align: right;">下载</span>
        </div>
        <div id="songListItems">
            <div class="no-result">输入关键词，开始探索</div>
        </div>
    </div>
    <div class="footer-note">数据来源于网易云音乐 API · 部分歌曲因版权限制无法下载</div>
</div>

<script>
    (function() {
        const BASE_URL = 'https://api.91videos.vip';
        const SEARCH_ENDPOINT = '/search';
        const LIMIT = 20;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusArea = document.getElementById('statusArea');
        const songListItems = document.getElementById('songListItems');
        const audioPlayer = document.getElementById('audioPlayer');

        let currentPlayingId = null;

        function setStatus(text, isError = false) {
            if (statusArea) {
                const color = isError ? '#b33' : '#666';
                statusArea.innerHTML = `<span style="color:${color};">${text}</span>`;
            }
        }

        function stopCurrentPlayback() {
            if (!audioPlayer.paused) {
                audioPlayer.pause();
            }
            audioPlayer.src = '';
            document.querySelectorAll('.play-btn.playing').forEach(el => {
                el.classList.remove('playing');
                el.textContent = '▶ 试听';
            });
            currentPlayingId = null;
        }

        // 获取歌曲真实链接 (用于试听和下载)
        function fetchSongUrl(id) {
            return fetch(`${BASE_URL}/song/url?id=${id}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                let realUrl = null;
                if (data.data && Array.isArray(data.data) && data.data.length > 0) {
                    realUrl = data.data[0].url;
                } else if (data.url) {
                    realUrl = data.url;
                } else if (data.data && typeof data.data === 'object' && data.data.url) {
                    realUrl = data.data.url;
                }
                return realUrl;
            });
        }

        // 下载功能：获取真实链接后通过a标签下载
        async function downloadSong(id, btnElement, songName) {
            if (!id) {
                setStatus('⚠️ 无法获取歌曲ID', true);
                return;
            }

            // 禁用按钮，防止重复点击
            btnElement.disabled = true;
            btnElement.textContent = '⏳ 获取中...';
            btnElement.classList.add('disabled');

            try {
                const realUrl = await fetchSongUrl(id);

                if (!realUrl) {
                    setStatus('❌ 该歌曲暂无下载链接 (可能受版权保护)', true);
                    btnElement.textContent = '⬇ 下载';
                    btnElement.disabled = false;
                    btnElement.classList.remove('disabled');
                    return;
                }

                // 通过创建a标签触发下载
                const link = document.createElement('a');
                link.href = realUrl;
                // 设置下载文件名
                const fileName = songName ? `${songName}.mp3` : `song_${id}.mp3`;
                link.download = fileName;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setStatus(`✅ 开始下载: ${songName || '未知歌曲'}`, false);
                btnElement.textContent = '✅ 已下载';
                setTimeout(() => {
                    btnElement.textContent = '⬇ 下载';
                    btnElement.disabled = false;
                    btnElement.classList.remove('disabled');
                }, 2000);

            } catch (err) {
                console.error('下载失败:', err);
                setStatus(`❌ 下载失败: ${err.message || '未知错误'}`, true);
                btnElement.textContent = '⬇ 下载';
                btnElement.disabled = false;
                btnElement.classList.remove('disabled');
            }
        }

        // 试听功能
        async function playSong(id, btnElement) {
            if (!id) {
                setStatus('⚠️ 无法获取歌曲ID', true);
                return;
            }

            if (currentPlayingId === id && !audioPlayer.paused) {
                stopCurrentPlayback();
                return;
            }

            stopCurrentPlayback();

            btnElement.textContent = '⏳ 加载中...';
            btnElement.disabled = true;

            try {
                const realUrl = await fetchSongUrl(id);

                if (!realUrl) {
                    setStatus('❌ 无法获取试听链接 (可能无版权)', true);
                    btnElement.textContent = '▶ 试听';
                    btnElement.disabled = false;
                    return;
                }

                audioPlayer.src = realUrl;
                await audioPlayer.play();

                btnElement.classList.add('playing');
                btnElement.textContent = '⏹ 停止';
                currentPlayingId = id;
                btnElement.disabled = false;
                setStatus(`🎵 正在播放: ${id}`, false);

            } catch (err) {
                console.error('试听失败:', err);
                setStatus(`❌ 试听失败: ${err.message || '未知错误'}`, true);
                btnElement.textContent = '▶ 试听';
                btnElement.disabled = false;
            }
        }

        function renderSongs(songs) {
            if (!songListItems) return;

            if (!songs || songs.length === 0) {
                songListItems.innerHTML = `<div class="no-result">😌 没有找到相关歌曲，试试其他关键词</div>`;
                return;
            }

            const items = songs.slice(0, LIMIT);
            let html = '';
            items.forEach((song, index) => {
                const id = song.id || '';
                const name = song.name || '未知歌曲';
                let artist = '未知歌手';
                if (song.ar && Array.isArray(song.ar) && song.ar.length > 0) {
                    artist = song.ar.map(a => a.name).join(' / ');
                } else if (song.artists && Array.isArray(song.artists) && song.artists.length > 0) {
                    artist = song.artists.map(a => a.name).join(' / ');
                } else if (song.artist) {
                    artist = song.artist;
                } else if (song.singer) {
                    artist = song.singer;
                }

                html += `
                    <div class="song-item" data-id="${id}">
                        <span class="song-index">${index + 1}</span>
                        <span class="song-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                        <span class="song-artist" title="${escapeHtml(artist)}">${escapeHtml(artist)}</span>
                        <span class="song-actions" style="justify-content: center;">
                            <button class="action-btn play-btn" data-id="${id}">▶ 试听</button>
                        </span>
                        <span class="song-actions" style="justify-content: flex-end;">
                            <button class="action-btn download-btn" data-id="${id}" data-name="${escapeHtml(name)}">⬇ 下载</button>
                        </span>
                    </div>
                `;
            });

            songListItems.innerHTML = html;

            // 绑定试听按钮事件
            songListItems.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    if (id) {
                        playSong(id, this);
                    } else {
                        setStatus('⚠️ 歌曲ID无效', true);
                    }
                });
            });

            // 绑定下载按钮事件
            songListItems.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.getAttribute('data-id');
                    const name = this.getAttribute('data-name') || '未知歌曲';
                    if (id) {
                        downloadSong(id, this, name);
                    } else {
                        setStatus('⚠️ 歌曲ID无效', true);
                    }
                });
            });

            audioPlayer.onended = function() {
                document.querySelectorAll('.play-btn.playing').forEach(el => {
                    el.classList.remove('playing');
                    el.textContent = '▶ 试听';
                });
                currentPlayingId = null;
                setStatus('⏹ 播放结束', false);
            };

            audioPlayer.onpause = function() {
                if (!audioPlayer.ended) {
                    document.querySelectorAll('.play-btn.playing').forEach(el => {
                        el.classList.remove('playing');
                        el.textContent = '▶ 试听';
                    });
                    currentPlayingId = null;
                    setStatus('⏸ 已暂停', false);
                }
            };
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        async function performSearch(keyword) {
            if (!keyword || keyword.trim() === '') {
                setStatus('⚠️ 请输入搜索关键词', true);
                return;
            }

            stopCurrentPlayback();

            const trimmed = keyword.trim();
            setStatus(`⏳ 搜索 “${escapeHtml(trimmed)}” ...`);

            if (songListItems) {
                songListItems.innerHTML = `<div class="no-result" style="color:#888;">⏳ 加载中...</div>`;
            }

            try {
                const searchUrl = `${BASE_URL}${SEARCH_ENDPOINT}?keywords=${encodeURIComponent(trimmed)}&type=1&limit=${LIMIT}`;
                const response = await fetch(searchUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                if (!data || typeof data !== 'object') {
                    throw new Error('返回数据格式异常');
                }

                let songs = null;
                if (data.result && Array.isArray(data.result.songs)) {
                    songs = data.result.songs;
                } else if (data.songs && Array.isArray(data.songs)) {
                    songs = data.songs;
                } else if (data.data && Array.isArray(data.data)) {
                    songs = data.data;
                } else if (Array.isArray(data)) {
                    songs = data;
                } else {
                    if (data.result && typeof data.result === 'object' && Array.isArray(data.result)) {
                        songs = data.result;
                    } else {
                        for (const key in data) {
                            if (Array.isArray(data[key]) && data[key].length > 0) {
                                if (data[key][0] && (data[key][0].id || data[key][0].name)) {
                                    songs = data[key];
                                    break;
                                }
                            }
                        }
                    }
                }

                if (!songs || !Array.isArray(songs) || songs.length === 0) {
                    setStatus(`🔍 未找到 “${escapeHtml(trimmed)}” 相关歌曲`, false);
                    if (songListItems) {
                        songListItems.innerHTML = `<div class="no-result">😕 没有找到 “${escapeHtml(trimmed)}” 的歌曲</div>`;
                    }
                    return;
                }

                setStatus(`✅ 找到 ${songs.length} 首歌曲 (显示前${Math.min(songs.length, LIMIT)}首)`);
                renderSongs(songs);

            } catch (error) {
                console.error('搜索出错:', error);
                setStatus(`❌ 搜索失败: ${error.message || '未知错误'}`, true);
                if (songListItems) {
                    songListItems.innerHTML = `<div class="no-result" style="color:#b33;">⚠️ 请求出错，请稍后再试</div>`;
                }
            }
        }

        function init() {
            searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                performSearch(searchInput.value);
            });

            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    searchBtn.click();
                }
            });

            setTimeout(() => {
                const defaultKeyword = searchInput.value.trim() || '周杰伦';
                performSearch(defaultKeyword);
            }, 120);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
</body>
</html>
